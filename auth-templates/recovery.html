<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPT Image 密码找回验证码</title>
  </head>
  <body style="margin:0;background:#f4f6fa;color:#172033;font-family:Arial,'Microsoft YaHei',sans-serif">
    <div style="max-width:560px;margin:32px auto;padding:32px;background:#fff;border:1px solid #e4e8f0;border-radius:16px">
      <h2 style="margin:0 0 16px">找回你的 GPT Image 账户</h2>
      <p style="margin:0 0 20px;line-height:1.7">请在网站的“输入找回验证码”界面填写下面的六位验证码：</p>
      <div style="margin:20px 0;padding:18px;text-align:center;background:#f1f8ff;border-radius:12px;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</div>
      <p style="margin:20px 0 0;color:#667085;line-height:1.7">验证码将在短时间内失效。请勿转发给他人。如果不是你本人发起的找回，请忽略这封邮件。</p>
    </div>
  </body>
</html>
