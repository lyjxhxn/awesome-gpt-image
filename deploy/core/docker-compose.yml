name: awesome-gpt-image-supabase

services:
  db:
    image: ${POSTGRES_IMAGE:-supabase/postgres:17.6.1.136}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -D
      - /etc/postgresql
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../supabase/migrations:/project-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  auth:
    image: ${GOTRUE_IMAGE:-supabase/gotrue:v2.196.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-GPT Image Gallery}
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${MAILER_TEMPLATES_RECOVERY:-http://awesome-gpt-image:8787/auth-templates/recovery.html}
      GOTRUE_MAILER_SUBJECTS_RECOVERY: ${MAILER_SUBJECTS_RECOVERY:-GPT Image 密码找回验证码}
    mem_limit: 128m

  rest:
    image: ${POSTGREST_IMAGE:-postgrest/postgrest:v14.17}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    mem_limit: 96m

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    environment:
      SUPABASE_PUBLIC_HOST: ${SUPABASE_PUBLIC_HOST}
      APP_PUBLIC_HOST: ${APP_PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CADDYFILE:-./Caddyfile.test}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 64m

volumes:
  db-data:
  caddy-data:
  caddy-config:
