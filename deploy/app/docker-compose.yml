name: awesome-gpt-image-app

services:
  app:
    build:
      context: ../..
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    image: awesome-gpt-image:auth
    container_name: awesome-gpt-image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      SUPABASE_URL: http://gateway
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - backend
    mem_limit: 512m

networks:
  backend:
    external: true
    name: awesome-gpt-image-supabase_default
